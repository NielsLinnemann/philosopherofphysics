<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- warm cream background circle -->
  <circle cx="16" cy="16" r="16" fill="#f0ebe1"/>
  <!-- "N" in deep terracotta, slightly condensed serif feel via paths -->
  <text
    x="16" y="22.5"
    font-family="Georgia, serif"
    font-size="19"
    font-weight="700"
    fill="#7a3020"
    text-anchor="middle"
