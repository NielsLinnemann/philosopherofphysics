const gate = document.getElementById('gate');
const article = document.getElementById('article');
const form = document.getElementById('unlock');
const field = document.getElementById('password');
const status = document.getElementById('status');
const submit = document.getElementById('submit');
const toolbar = document.getElementById('toolbar');
function lock() {
  article.replaceChildren(); article.hidden = true; toolbar.hidden = true;
  gate.hidden = false; field.value = ''; status.textContent = ''; field.focus();
}
function bytes(value) { return Uint8Array.from(atob(value), c => c.charCodeAt(0)); }
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!globalThis.crypto?.subtle) { status.textContent = 'Please open this page in a current browser over HTTPS.'; return; }
  submit.disabled = true; status.textContent = 'Unlocking…';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(payload.salt), iterations:payload.iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(payload.iv)}, key, bytes(payload.data));
    article.innerHTML = new TextDecoder('utf-8', {fatal:true}).decode(plain);
    field.value = ''; status.textContent = ''; gate.hidden = true;
    article.hidden = false; toolbar.hidden = false; article.focus();
  } catch {
    article.replaceChildren(); article.hidden = true;
    status.textContent = 'Unable to unlock. Please check the password and try again.';
    field.value = ''; field.focus();
  } finally { submit.disabled = false; }
});
document.getElementById('lock').addEventListener('click', lock);
window.addEventListener('pageshow', event => { if (event.persisted) lock(); });
</script></body></html>
